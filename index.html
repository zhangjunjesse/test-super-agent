<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050913" />
  <meta name="description" content="霓虹贪吃蛇：一个无需安装、打开浏览器就能玩的 HTML5 小游戏。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050913'/%3E%3Ccircle cx='11' cy='16' r='4.5' fill='%2322d3ee'/%3E%3Ccircle cx='20' cy='16' r='4.5' fill='%23a78bfa'/%3E%3C/svg%3E" />
  <title>霓虹贪吃蛇 · Neon Snake</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="aurora aurora--cyan" aria-hidden="true"></div>
  <div class="aurora aurora--violet" aria-hidden="true"></div>

  <main class="game-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand__mark" aria-hidden="true"></span>
        <div>
          <h1 class="brand__title">霓虹贪吃蛇</h1>
          <p class="brand__subtitle">NEON SNAKE</p>
        </div>
      </div>
      <div class="topbar__actions">
        <button class="icon-btn" id="pause" type="button" disabled aria-label="暂停游戏" title="暂停游戏 (Space)">
          <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="7" y="5" width="3.6" height="14" rx="1.6"></rect>
            <rect x="13.4" y="5" width="3.6" height="14" rx="1.6"></rect>
          </svg>
          <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden>
            <path d="M8 5.2v13.6L19 12z"></path>
          </svg>
        </button>
        <button class="icon-btn" id="sound" type="button" aria-label="关闭音效" title="关闭音效 (M)">
          <svg id="sound-on-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 9.5h3.2L12 5.6v12.8L7.7 14.5H4.5z" fill="currentColor" stroke="none"></path>
            <path d="M15.6 9.2a4.2 4.2 0 0 1 0 5.6"></path>
            <path d="M18.3 6.5a8 8 0 0 1 0 11"></path>
          </svg>
          <svg id="sound-off-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden>
            <path d="M4.5 9.5h3.2L12 5.6v12.8L7.7 14.5H4.5z" fill="currentColor" stroke="none"></path>
            <path d="M15.8 9.5l4.7 5"></path>
            <path d="M20.5 9.5l-4.7 5"></path>
          </svg>
        </button>
      </div>
    </header>

    <section class="scoreboard" aria-label="分数统计">
      <div class="stat stat--score">
        <span class="stat__label">得分</span>
        <strong class="stat__value" id="score">0</strong>
      </div>
      <div class="stat">
        <span class="stat__label">最高分</span>
        <strong class="stat__value" id="best">0</strong>
      </div>
      <div class="stat">
        <span class="stat__label">等级</span>
        <strong class="stat__value" id="level">1</strong>
      </div>
    </section>

    <div class="board-wrap" id="board-wrap">
      <canvas id="board" class="board-canvas" width="600" height="600" role="img" aria-label="贪吃蛇游戏棋盘"></canvas>
      <div class="overlay" id="overlay" data-kind="ready">
        <p class="overlay__eyebrow" id="overlay-eyebrow">准备好了吗？</p>
        <h2 class="overlay__title" id="overlay-title">霓虹贪吃蛇</h2>
        <p class="overlay__desc" id="overlay-desc">吃掉光点，蛇身会越来越长。用方向键 / WASD 或滑动棋盘控制，别撞墙，也别咬到自己。</p>
        <p class="overlay__score" id="overlay-score" hidden></p>
        <button class="primary-btn" id="action" type="button">开始游戏</button>
      </div>
    </div>

    <div class="controls">
      <div class="dpad" id="dpad" aria-label="触屏方向键">
        <button class="dpad__btn dpad__btn--up" type="button" data-dir="up" aria-label="向上">↑</button>
        <button class="dpad__btn dpad__btn--left" type="button" data-dir="left" aria-label="向左">←</button>
        <button class="dpad__btn dpad__btn--down" type="button" data-dir="down" aria-label="向下">↓</button>
        <button class="dpad__btn dpad__btn--right" type="button" data-dir="right" aria-label="向右">→</button>
      </div>
      <p class="hint">
        <span class="hint__desktop">方向键 / WASD 移动 · 空格暂停 · M 静音</span>
        <span class="hint__touch">滑动棋盘或点按方向键控制</span>
      </p>
    </div>
  </main>

  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
